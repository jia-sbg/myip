<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IP 检测 · 纯净度测评</title>
<link rel="preconnect" href="https://www.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cloudflare.com" crossorigin>
<link rel="preconnect" href="https://ipwho.is" crossorigin>
<link rel="preconnect" href="https://ipapi.co" crossorigin>
<link rel="dns-prefetch" href="https://dns.google">
<link rel="dns-prefetch" href="https://tiles.openfreemap.org">
<link rel="dns-prefetch" href="https://unpkg.com">
<!-- 地图样式异步加载，不阻塞首屏 -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" media="print" onload="this.media='all'">
<style>
:root{
--bg:#f4f5f7; --card:#fff; --text:#1a1d21; --sub:#6b7280; --faint:#9aa1ab;
--line:#e6e8eb; --chip:#f2f4f6; --accent:#2563eb; --ok:#12b76a; --warn:#f59e0b; --bad:#ef4444;
--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
--bg:#0d1117; --card:#161b22; --text:#e6edf3; --sub:#8b949e; --faint:#6e7681;
--line:#262d36; --chip:#1c2129; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
--shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
html[data-theme="auto"]{
--bg:#0d1117; --card:#161b22; --text:#e6edf3; --sub:#8b949e; --faint:#6e7681;
--line:#262d36; --chip:#1c2129; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
--shadow:0 1px 2px rgba(0,0,0,.3);
}
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
body{
min-height:100dvh;padding:22px 14px 44px;
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
a{color:var(--accent);text-decoration:none}
.emi{font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji","Twemoji Mozilla",sans-serif;font-style:normal}
/* 顶栏 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.state{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-left:6px}
.state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.state i.busy{background:var(--accent);animation:bl .9s infinite}
.state i.ok{background:var(--ok)}
.state i.bad{background:var(--bad)}
@keyframes bl{50%{opacity:.3}}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;transition:.15s}
.btn{padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-size:15px}
.icon:hover{border-color:var(--faint)}
/* 卡 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ipcard{padding:18px 18px 6px;overflow:hidden}
.ipcard .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ipcard .tag{font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--sub);border:1px solid var(--line)}
.ipcard .support{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);font-weight:600}
.ipcard .support i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ipcard .support.yes{color:var(--ok)}
.ipcard .support.yes i{background:var(--ok)}
.ipcard .support.no{color:var(--faint)}
.addr{
display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
font-size:clamp(17px,4.4vw,23px);font-weight:600;letter-spacing:-.01em;
word-break:break-all;line-height:1.35;margin-bottom:2px;
}
.addr.none{color:var(--faint);font-weight:500;font-size:16px;font-family:inherit}
.rows{padding:0}
.kv{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv .k{width:66px;flex:none;color:var(--sub);font-size:13px}
.kv .v{flex:1;min-width:0;word-break:break-word;display:flex;align-items:center;gap:6px}
.kv .v .fl{font-size:17px;line-height:1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.mut{color:var(--sub)}
.skel{display:inline-block;border-radius:5px;color:transparent;
background:linear-gradient(90deg,var(--chip) 25%,var(--line) 37%,var(--chip) 63%);
background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.skel.l{width:74%;height:22px}.skel.s{width:110px;height:14px}
/* 地图 */
.mapbox{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--chip)}
#map,.fallback{width:100%;height:300px}
.fallback{display:block}
.mapbox .hint{position:absolute;right:10px;bottom:10px;z-index:3;font-size:11.5px;color:var(--text);
background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;opacity:.92}
.mapbox .cover{position:absolute;inset:0;z-index:2;display:grid;place-items:center;gap:6px;
font-size:13px;color:var(--sub);background:var(--chip);text-align:center;padding:12px}
.mapbox .cover .spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.maplibregl-ctrl-attrib{font-size:11px}
/* 纯净度测评 */
.pure{display:flex;gap:16px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.ringwrap{position:relative;width:92px;height:92px;flex:none}
.ringwrap svg{width:92px;height:92px;transform:rotate(-90deg)}
.ringwrap .trk{fill:none;stroke:var(--line);stroke-width:9}
.ringwrap .bar{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .55s ease,stroke .3s}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ringwrap .num b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ringwrap .num span{display:block;font-size:10.5px;color:var(--sub);font-weight:600}
.pmain{flex:1;min-width:210px}
.lvl{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl .badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
.b-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.b-mid{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.b-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.b-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.b-mut{color:var(--sub);border-color:var(--line)}
.kindline{font-size:13px;color:var(--sub);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kindline b{color:var(--text)}
.dets{width:100%;margin-top:12px;border-top:1px solid var(--line)}
.det{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.det:last-child{border-bottom:0}
.det .dk{width:108px;flex:none;color:var(--sub);font-weight:600;font-size:12.5px}
.det .dn{flex:1;color:var(--sub);font-size:12.5px;word-break:break-word}
.det .ds{flex:none;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.ds.ok{color:var(--ok)}.ds.bad{color:var(--bad)}.ds.warn{color:var(--warn)}.ds.mut{color:var(--faint)}
.purefoot{width:100%;padding-top:11px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.purefoot .btn{padding:7px 13px}
/* 详情 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px;align-items:start}
.sec{padding:15px 17px 6px}
.sec h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--sub);text-transform:uppercase;margin-bottom:4px}
.r{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.r:first-of-type{border-top:0}
.r .k{width:74px;flex:none;color:var(--sub);font-size:13px}
.r .v{flex:1;min-width:0;word-break:break-word;font-variant-numeric:tabular-nums}
.r[data-copy]{cursor:copy}
.r[data-copy]:hover .v{color:var(--accent)}
.pill{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:600;background:var(--chip);border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:0}
.tg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--sub)}
.tg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tg.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.tg.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tg.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sub);padding:0 4px}
.foot b{color:var(--text);font-weight:600}
.kbd{padding:1px 5px;border-radius:5px;border:1px solid var(--line);background:var(--chip);font-family:ui-monospace,Menlo,monospace;font-size:11px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);padding:9px 17px;border-radius:10px;
font-size:14px;font-weight:600;background:var(--text);color:var(--card);opacity:0;pointer-events:none;transition:.22s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
.dual{grid-template-columns:1fr}
#map,.fallback{height:220px}
.addr{font-size:clamp(16px,5.4vw,20px)}
.ringwrap,.ringwrap svg{width:78px;height:78px}
.det .dk{width:88px}
}
</style>
</head>

<div class="wrap">
<div class="top">

<button class="btn primary" id="refresh">重新检测</button>
</div>

<div class="dual">
<section class="card ipcard" id="c4">
<div class="head"><span class="tag">IPv4</span><span class="support" id="s4"><i></i><span>检测中</span></span></div>
<div class="addr" id="a4"><span class="skel l">…</span></div>
<div class="rows" id="r4"></div>
</section>
<section class="card ipcard" id="c6">

<div class="rows" id="r6"></div>
</section>
</div>

<section class="card pure" id="pure" hidden>
<div class="ringwrap">

<div class="num"><b id="score">–</b><span id="scorecap">纯净度</span></div>
</div>
<div class="pmain">
<div class="lvl"><span id="lvltxt">测评中…</span><span class="badge b-mut" id="lvlbadge">等待数据</span></div>

</div>
<div class="dets" id="dets"></div>
<div class="purefoot">
<span id="purenote">本地判定基于公开 ASN / 安全库，仅供参考。</span>
<span class="spacer"></span>
<a class="btn primary" href="https://ippure.com" target="_blank" rel="noopener">去 IPPure 深度检测 ↗</a>
</div>
</section>

<section class="card mapbox">
<div id="map"></div>
<svg class="fallback" id="fbmap" viewBox="0 0 720 360" hidden></svg>
<div class="cover" id="mapcover"><span class="spin"></span><span>正在定位…</span></div>
<div class="hint" id="maphud">等待定位…</div>
</section>

<div id="tags" class="tags"></div>
<div class="grid" id="grid"></div>
<div class="foot">
<span>数据源 <b>Cloudflare Trace</b> · <b>ipwho.is</b> / <b>ipapi.co</b> · 地图 <b>OpenFreeMap</b> · 深度 <b>IPPure</b></span>
<span id="ftime">—</span>
<span>纯前端，不记录任何数据</span>
<span><span class="kbd">R</span> 重新检测 · <span class="kbd">C</span> 复制</span>
</div>
</div>
<div id="toast"></div>

const FLAG_FIX = { XK:'🏳️', EU:'🇪🇺', EZ:'🇪🇺', AP:'🏳️', A1:'🏳️', A2:'🏳️', O1:'🏳️', XX:'🏳️', T1:'🧅' };
const contName = c => CONT[String(c||'').toUpperCase()] || '';
const contEmoji = c => CONT_EMOJI[String(c||'').toUpperCase()] || '🌐';
const flagOf = c => {
const k = String(c || '').toUpperCase();
if (FLAG_FIX[k]) return FLAG_FIX[k];
return /^[A-Za-z]{2}$/.test(k) ? String.fromCodePoint(...[...k].map(x => 0x1F1E6 + x.charCodeAt(0) - 65)) : '🏳️';
};
const rn = (()=>{ try{ return new Intl.DisplayNames(['zh-CN'],{type:'region'}); }catch{ return null; } })();
const cname = c => {
const k = String(c || '').toUpperCase();
if (CC.has(k)) return CC.get(k).zh;
if (k && rn){ try{ const n = rn.of(k); if (n && n !== k) return n; }catch{} }
return k || '';
};
const countryOf = (code, rawName) => {
const k = String(code || '').toUpperCase();
if (CC.has(k)) return { cc:k, zh:CC.get(k).zh, cont:contName(CC.get(k).cont), emoji:flagOf(k), contE:contEmoji(CC.get(k).cont) };
const byName = rawName && CC_NAME.get(rawName);
if (byName) return { cc:byName, zh:CC.get(byName).zh, cont:contName(CC.get(byName).cont), emoji:flagOf(byName), contE:contEmoji(CC.get(byName).cont) };
const z = (k && rn) ? (()=>{ try{ return rn.of(k) || ''; }catch{ return ''; } })() : '';
return { cc:k, zh:z || rawName || k || '', cont:'', emoji:flagOf(k), contE:'🌐' };
};

const dms = (la,lo) => {
const f = (v,p,n) => { const a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d)*3600-m*60);
return `${d}°${String(m).padStart(2,'0')}′${s.toFixed(1)}″${v>=0?p:n}`; };
return `${f(la,'N','S')} ${f(lo,'E','W')}`;
};

/* 竞速：并发发起，取第一个“有效”结果即返回，其余立即中止 */
function race(tasks, valid){
return new Promise(resolve => {
let n = tasks.length, done = false;
const ac = new AbortController();
const fin = v => { if (done) return; done = true; try{ ac.abort(); }catch{} resolve(v); };
const tick = () => { if (--n <= 0 && !done){ done = true; resolve(null); } };
for (const t of tasks){
Promise.resolve().then(() => t(ac.signal)).then(v => {
if (v != null && (!valid || valid(v))) fin(v); else tick();
}).catch(tick);
}
setTimeout(() => { if (!done){ done = true; try{ ac.abort(); }catch{} resolve(null); } }, 9000);
});
}
async function grab(url, ms = 5000, signal){
const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
if (signal) signal.addEventListener('abort', () => ac.abort(), { once:true });
try{
const r = await fetch(url, { signal:ac.signal, cache:'no-store', credentials:'omit' });
if (!r.ok) throw new Error('HTTP ' + r.status);
return r;
} finally { clearTimeout(t); }
}
const parseTrace = t => { const o={}; for (const l of String(t).trim().split('\n')){ const i=l.indexOf('='); if(i>0) o[l.slice(0,i).trim()]=l.slice(i+1).trim(); } return o; };
async function getBase(){
return race(CF.map(u => sig => grab(u, 4500, sig).then(r => r.text()).then(t => { const d = parseTrace(t); return d.ip ? d : null; })));
}
async function probe(list, want, sig){
return race(list.map(u => s => grab(u, 3500, s || sig).then(r => r.text()).then(t => { const ip = t.trim(); return isIP(ip) && ver(ip) === want ? ip : null; })));
}
function normalize(j){
if (!j || j.error || j.success === false) return null;
const cn = j.connection || {}, tz = j.timezone || {}, cur = j.currency || {}, sec = j.security || {};
const asn = String(cn.asn ?? cn.asn_number ?? j.asn ?? '').replace(/^AS/i,'');
let cc = j.country_code || j.countryCode || (typeof j.country === 'string' && /^[A-Za-z]{2}$/.test(j.country) ? j.country.toUpperCase() : '');
cc = String(cc || '').toUpperCase();
const contCode = j.continent_code || j.continentCode || '';
const curCode = cur.code || j.currency_code || (typeof j.currency === 'string' ? j.currency : '');
const lat = j.latitude ?? j.lat ?? null, lon = j.longitude ?? j.lon ?? null;
return {
city:j.city||'', region:j.region||j.region_name||'', country:j.country_name||j.country||'', countryCode:cc,
continent: contName(contCode) || j.continent || '', capital:j.capital||j.country_capital||'',
postal:j.postal||j.postal_code||j.postal_Code||'', lat, lon,
accuracy: j.accuracy_radius ?? null, tz: tz.id || (typeof j.timezone === 'string' ? j.timezone : ''),
tzAbbr: tz.abbr || '', utcOffset: tz.utc || j.utc_offset || '', dst: tz.is_dst ?? null,
calling: fmtCalling(j.calling_code || j.dial_code || j.country_calling_code || ''),
currency:[curCode, cur.name || j.currency_name || '', cur.symbol || ''].filter(Boolean).join(' · '),
lang: j.languages || '', tld: j.country_tld || '', isEU: j.is_eu ?? j.is_in_eu ?? null,
area: isNum(j.country_area) ? j.country_area : null, pop: isNum(j.country_population) ? j.country_population : null,
asn, asnOrg: cn.asn_org || '', isp: cn.isp || '', org: stripAS(cn.org || j.org || '') || stripAS(cn.asn_org || ''),
domain: cn.domain || '', connType: cn.connection_type || '', network: j.network || '', ipType: j.type || j.version || '',
secProxy: sec.proxy, secVpn: sec.vpn ?? sec.isVpn, secTor: sec.tor ?? sec.isTor,
secHost: sec.hosting, secAnon: sec.anonymous, secThreat: sec.isThreat
};
}
const blank = v => v === '' || v === null || v === undefined;
const merge = (a,b) => {
if (!a) return b; if (!b) return a;
for (const k in b) if (blank(a[k]) && !blank(b[k])) a[k] = b[k];
return a;
};
/* 缓存：同一 IP 12 小时内复用 */
const cGet = k => { try{ const raw = localStorage.getItem(k); if (!raw) return null; const o = JSON.parse(raw); if (!o || Date.now() - o.t > 432e5) return null; return o.v; }catch{ return null; } };
const cSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify({ t:Date.now(), v })); }catch{} };
async function getDetail(ip, sig){
const ck = 'ipx:geo:' + ip;
const cached = cGet(ck);
const net = race(DETAIL(ip).map(u => s => grab(u, 5000, s || sig).then(r => r.json()).then(normalize)),
n => n && (n.country || n.city || n.asn || n.isp || n.org));
if (cached) return { d: cached, cached: true, net };
const d = await net;
if (d) cSet(ck, d);
return { d, cached:false, net:null };
}

function radiusGeo(lat, lon, km){
const pts = [], dLat = km / 111.32;
const dLon = km / (111.32 * Math.max(0.15, Math.cos(lat * Math.PI / 180)));
for (let i = 0; i <= 72; i++){
const a = i * Math.PI * 2 / 72;
pts.push([lon + Math.cos(a) * dLon, lat + Math.sin(a) * dLat]);
}
return { type:'Feature', geometry:{ type:'Polygon', coordinates:[pts] }, properties:{} };
}

function riskCompute(st){

else if (isDC){ kind = 'dc'; kindTxt = '机房 / 数据中心 IP'; }
else if (mobKey){ kind = 'mobile'; kindTxt = '移动蜂窝网络'; }
else if (resKey){ kind = 'residential'; kindTxt = '住宅宽带'; }
else { kind = 'biz'; kindTxt = '企业 / 机构 / 其他'; }

/* --- 原生 IP 判定：ASN 归属国 vs 落地国 --- */
const cc = String(d.countryCode || (base && base.loc) || '').toUpperCase();
const ispCC = (() => { for (const [k,v] of ISP_CC){ if (txt.includes(k)) return v; } return ''; })();

else if (isVpn) minus(58, 'VPN 出口', d.secVpn === true ? '安全库标记' : (vpnKey ? '名称命中：' + vpnKey : ''));
else if (isProxy) minus(50, '代理出口', '安全库标记');
else if (isDC) minus(55, '机房 / 云主机 IP', d.secHost === true ? '安全库标记 hosting' : (dcKey ? '名称命中：' + dcKey : ''));

/* ================= 隐私检测（后台异步，不阻塞） ================= */
function webrtcLeak(ms = 2600){
return new Promise(res => {
const RTCP = window.RTCPeerConnection || window.webkitRTCPeerConnection;
if (!RTCP) return res(null);
const ips = new Set(); let pc = null;
try{
pc = new RTCP({ iceServers:[{ urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302'] }] });
pc.createDataChannel('x');
pc.onicecandidate = e => {
const c = e && e.candidate && e.candidate.candidate;
if (!c) return;
const m = /([\d]{1,3}(?:\.[\d]{1,3}){3}|[0-9a-fA-F]{0,4}(?::[0-9a-fA-F]{0,4}){2,7})/.exec(c);
if (m) ips.add(m[1]);
};
pc.createOffer().then(o => pc.setLocalDescription(o)).catch(()=>{});
}catch(e){ return res(null); }
setTimeout(() => {
try{ pc.close(); }catch{}
const pub = [...ips].filter(x => isV4(x) || isV6(x)).filter(x => {
if (isV4(x)){
const p = x.split('.').map(Number);
return !(p[0] === 10 || (p[0] === 172 && p[1] >= 16 && p[1] <= 31) || (p[0] === 192 && p[1] === 168) || p[0] === 127 || (p[0] === 169 && p[1] === 254) || p[0] === 0 || p[0] >= 224);
}
return !/^(fd|fe80|::1)/i.test(x);
});
res(pub);
}, ms);
});
}

setVal('dnsExit', pv.dns || '');
setVal('dnsMatch', pv.dns ? (pv.dns === ip ? '一致' : '不一致') : '');
setVal('rtc', pv.rtc ? (pv.rtc.length ? '存在泄露' : '未泄露') : '');
if (pv.rtc && pv.rtc.length) setVal('rtcIP', pv.rtc.join(' / '), { mono:true });
else setVal('rtcIP','');
setVal('tzMatch', pv.tzLocal != null ? (pv.tzMismatch ? '不一致' : '一致') + '（本机 ' + pv.tzLocal + '）' : '');
setVal('langMatch', pv.langMismatch != null ? (pv.langMismatch ? '不一致' : '一致') : '');

const ci = client();
setVal('browser', ci.b); setVal('os', ci.os); setVal('device', ci.dev); setVal('langs', ci.langs);
setVal('screen', `${screen.width} × ${screen.height} @ ${devicePixelRatio}x`);

const r = renderRisk({ base, d, ip4, ip6, priv:pv });
if (r && r.score != null){ const t = document.createElement('span'); t.className = 'tg ' + (r.level.c === 'ok' ? 'ok' : r.level.c === 'warn' ? 'warn' : r.level.c === 'mut' ? '' : 'bad');
t.textContent = `纯净度 ${r.score} · ${r.level.t}`; el.tags.append(t); }

initMap(hasCoord ? d.lat : null, hasCoord ? d.lon : null, placeTxt || ip, d && d.accuracy);
el.copyAll.disabled = !ip;
snap = { base, d, ip4, ip6, d4, d6, priv:pv };
}

/* ================= 环境一致性 ================= */
function envCheck(d, ip){
const priv = {};
try{ priv.tzLocal = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch{ priv.tzLocal = ''; }
if (d && d.tz){
const a = utcMin(d.utcOffset), b = offMin();
priv.tzMismatch = (a != null && Math.abs(a - b) > 45) || (!!priv.tzLocal && priv.tzLocal.toLowerCase() === String(d.tz).toLowerCase() ? false : (a != null ? Math.abs(a - b) > 45 : false));
}
const cc = String((d && d.countryCode) || '').toUpperCase();
const langCC = (navigator.language || '').split('-')[1];
priv.langMismatch = !!(cc && langCC && cc !== langCC.toUpperCase());
return priv;
}

/* ================= 报告 / 复制 ================= */
function report(){
const L = ['IP 检测报告', '生成时间：' + new Date().toLocaleString('zh-CN'), ''];
const stack = (n, ip, d) => {
L.push(`【${n}】`, '  地址：' + (ip || '不支持'));
if (ip && d){
const c = countryOf(d.countryCode, d.country);
const p = [c.zh, d.region, d.city].filter(Boolean).join(' · ');
if (p) L.push('  位置：' + c.emoji + ' ' + p);
if (d.isp) L.push('  运营商：' + d.isp);
if (d.asn) L.push('  ASN：AS' + d.asn);
}
L.push('');
};
if (snap){
stack('IPv4', snap.ip4, snap.d4); stack('IPv6', snap.ip6, snap.d6);
const r = riskCompute(snap);
L.push('【纯净度测评】', '  评分：' + (r.score == null ? '数据不足' : r.score + ' / 100（' + r.level.t + '）'), '  类型：' + r.kindTxt,
'  原生判定：' + ({native:'原生住宅',broadcast:'异地广播',hosting:'机房/代理',unknown:'未判定'})[r.native] + (r.nativeNote ? '（' + r.nativeNote + '）' : ''), '');
for (const it of r.items) L.push('  - ' + it.label + (it.note ? '：' + it.note : '') + (it.delta < 0 ? '（' + it.delta + '）' : ''));
L.push('');
}
for (const c of CARDS){
const sec = el.grid.querySelector(`[data-card="${c.id}"]`);
if (!sec || sec.hidden) continue;
const items = [...sec.querySelectorAll('.r')].filter(r => !r.hidden)
.map(r => '  ' + r.querySelector('.k').textContent + '：' + ((r.querySelector('.v')._t)||'').trim())
.filter(x => !/：\s*$/.test(x));
if (items.length) L.push(`【${c.t}】`, ...items, '');
}
L.push('—— 深度检测：https://ippure.com');
return L.join('\n');
}
async function copy(text, msg){
try{ await navigator.clipboard.writeText(text); }
catch{
const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
document.body.append(t); t.select(); try{ document.execCommand('copy'); }catch{} t.remove();
}
toast(msg);
}
let tt; function toast(m){ el.toast.textContent = m; el.toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.toast.classList.remove('on'), 1500); }

/* ================= 流程 ================= */
const setS = (k,t) => { el.dot.className = k || ''; el.state.textContent = t; };
function resetUI(){
el.refresh.disabled = true; el.copyAll.disabled = true;
el.tags.textContent = ''; clearAll(); clearInterval(tzTimer); tzTimer = null;
setS('busy','检测中…');
el.a4.innerHTML = '<span class="skel l">…</span>'; el.a6.innerHTML = '<span class="skel l">…</span>';
el.r4.textContent = ''; el.r6.textContent = '';
el.s4.className = 'support'; supText(el.s4,'检测中');
el.s6.className = 'support'; supText(el.s6,'检测中');
el.cover.hidden = false; el.cover.innerHTML = '<span class="spin"></span><span>正在定位…</span>';
el.hud.textContent = '等待定位…';
el.pure.hidden = false;
el.score.textContent = '–'; el.ring.style.strokeDashoffset = String(RING);
el.lvltxt.textContent = '测评中…'; el.lvlbadge.textContent = '等待数据'; el.lvlbadge.className = 'badge b-mut';
el.kindline.textContent = '正在解析 IP 归属类型…'; el.dets.textContent = '';
}
async function load(){
const t0 = performance.now();
resetUI();
try{
/* 阶段 1：Cloudflare trace 与“另一栈”探测并发竞速，最快者胜 */
const baseP = getBase();
const [base, other] = await Promise.all([
baseP,
(async () => {
const b = await baseP;
const bv = b && b.ip ? ver(b.ip) : 0;
const jobs = [];
if (bv !== 4) jobs.push(probe(V4P, 4));
if (bv !== 6) jobs.push(probe(V6P, 6));
const res = await Promise.all(jobs);
return { v4: bv === 4 ? null : res[0], v6: bv === 6 ? null : (bv === 4 ? (res[0] || null) : res[jobs.length-1]) };
})()
]);
let ip4 = '', ip6 = '';
if (base && base.ip){ if (ver(base.ip) === 6) ip6 = base.ip; else ip4 = base.ip; }
if (other && other.v4) ip4 = ip4 || other.v4;
if (other && other.v6) ip6 = ip6 || other.v6;
if (!base && !ip4 && !ip6) throw new Error('网络不通，检测失败');
const main = (base && base.ip) || ip4 || ip6;

/* 阶段 1.5：先出 IP（缓存命中则几乎瞬时） */
renderStack(4, ip4, cGet('ipx:geo:' + ip4));
renderStack(6, ip6, cGet('ipx:geo:' + ip6));
setS('', '已获取出口 IP，正在补全…');
loadMapLib().catch(()=>{});                    // 预热地图脚本，不与主流程争抢

/* 阶段 2：归属详情（缓存优先，网络竞速；第二数据源后台补字段） */
const g = await getDetail(main);
let d = g.d;
const dmain = d;
render(base, d, ip4, ip6, d4Cache(ip4), d6Cache(ip6), envCheck(d, main));
const ms = Math.round(performance.now() - t0);
setS('ok', `检测完成 · ${ms} ms`);
el.ftime.textContent = new Date().toLocaleTimeString('zh-CN') + ` 检测 · 耗时 ${ms} ms` + (g.cached ? ' · 缓存' : '');
try{ localStorage.setItem('ipx:snap', JSON.stringify({ base, d:dmain, ip4, ip6, ts:Date.now() })); }catch{}

/* 阶段 2b：若首次为缓存，后台再取一次新鲜数据覆盖 */
if (g.cached && g.net){
g.net.then(fresh => {
if (fresh){ cSet('ipx:geo:' + main, fresh); snap = Object.assign({}, snap, { d:fresh }); render(base, fresh, ip4, ip6, d4Cache(ip4), d6Cache(ip6), envCheck(fresh, main)); }
}).catch(()=>{});
}

/* 阶段 3：隐私检测（WebRTC / DNS），完成后重算风险 */
Promise.all([webrtcLeak(), dnsExit()]).then(([rtc, dns]) => {
const pv = Object.assign(envCheck(dmain, main), { rtc: rtc || [], dns: dns || '' });
render(base, dmain, ip4, ip6, d4Cache(ip4), d6Cache(ip6), pv);
}).catch(()=>{});

/* 阶段 4：另一个栈的归属（低优先级，补齐双栈信息） */
const otherIP = main === ip4 ? ip6 : ip4;
if (otherIP){
(async () => {
const og = await getDetail(otherIP);
if (og && og.d){
if (main === ip4) render(base, dmain, ip4, ip6, d4Cache(ip4), og.d, (snap && snap.priv) || {});
else render(base, dmain, ip4, ip6, og.d, d6Cache(ip6), (snap && snap.priv) || {});
}
})().catch(()=>{});
}
}catch(e){
const msg = e && e.message ? e.message : '网络异常';
if (snap){
render(snap.base, snap.d, snap.ip4, snap.ip6, snap.d4, snap.d6, snap.priv);
setS('bad','刷新失败 · 显示上次结果');
el.ftime.textContent = '刷新失败（' + msg + '）· 当前为上次结果';
} else {
renderStack(4,'',null); renderStack(6,'',null);
el.a4.textContent = '—'; el.a4.classList.add('none');
el.a6.textContent = '—'; el.a6.classList.add('none');
el.pure.hidden = false;
el.score.textContent = '–'; el.lvltxt.textContent = '检测失败'; el.lvlbadge.textContent = '无数据'; el.lvlbadge.className = 'badge b-mut';
el.kindline.textContent = msg + '，可前往 IPPure 检测';
setS('bad','检测失败');
el.cover.hidden = false; el.cover.textContent = msg;
el.hud.textContent = '—'; el.ftime.textContent = '—';
}
}finally{ el.refresh.disabled = false; }
}
function d4Cache(ip){ return ip ? cGet('ipx:geo:' + ip) : null; }
function d6Cache(ip){ return ip ? cGet('ipx:geo:' + ip) : null; }
function restore(){
let raw; try{ raw = localStorage.getItem('ipx:snap'); }catch{ return false; }
if (!raw) return false;
try{
const s = JSON.parse(raw);
if (!s || !(s.ip4 || s.ip6 || (s.base && s.base.ip))) return false;
if (Date.now() - (s.ts || 0) > 864e5) return false;
render(s.base, s.d, s.ip4, s.ip6, d4Cache(s.ip4), d6Cache(s.ip6), envCheck(s.d, (s.base && s.base.ip) || s.ip4 || s.ip6));
const ago = Date.now() - s.ts, m = Math.round(ago / 60000);
setS('', '载入上次结果 · ' + (m < 1 ? '刚刚' : m < 60 ? m + ' 分钟前' : m < 1440 ? Math.round(m/60) + ' 小时前' : Math.round(m/1440) + ' 天前'));
el.ftime.textContent = '上次检测：' + new Date(s.ts).toLocaleString('zh-CN') + '（后台刷新中）';
return true;
}catch{ return false; }
}

/* ================= 事件 ================= */
el.refresh.onclick = load;
el.copyAll.onclick = () => snap && copy(report(), '完整报告已复制');
el.grid.addEventListener('click', e => {
const r = e.target.closest('.r[data-copy]'); if (!r) return;
const t = ((r.querySelector('.v')._t)||'').trim(); if (t) copy(t, '已复制：' + t.slice(0,22));
});
const TH = ['auto','light','dark'];
const TH_ICON = { auto:'◐', light:'☀', dark:'☾' };
el.theme.onclick = () => {
const cur = document.documentElement.dataset.theme || 'auto';
const nx = TH[(TH.indexOf(cur) + 1) % 3];
document.documentElement.dataset.theme = nx;
el.theme.textContent = TH_ICON[nx];
el.theme.title = '主题：' + ({auto:'跟随系统', light:'浅色', dark:'深色'})[nx];
try{ localStorage.setItem('ipx:theme', nx); }catch{}
const sd = snap && snap.d;
if (sd && isNum(sd.lat) && isNum(sd.lon)) initMap(sd.lat, sd.lon, lastPlace, sd.accuracy);
if (snap) renderRisk(snap);
};
try{
const t = localStorage.getItem('ipx:theme');
if (t){ document.documentElement.dataset.theme = t; el.theme.textContent = TH_ICON[t] || '◐'; }
}catch{}
document.addEventListener('keydown', e => {
if (e.metaKey || e.ctrlKey || e.altKey) return;
if (/^(input|textarea)$/i.test(e.target.tagName)) return;
const k = e.key.toLowerCase();
if (k === 'r'){ e.preventDefault(); if (!el.refresh.disabled) load(); }
if (k === 'c' && currentIP) copy(currentIP, '已复制 ' + currentIP);
});

build();
if (!restore()) showFallback(null, null);
load();
})();
</script>
